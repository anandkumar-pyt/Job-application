<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='/css/style.css')}}">
    <title>Job-Edit</title>
</head>
<body>
    <form action="{{url_for('edit_job',job_id=job.id)}}" method="POST">
        <label for="company">
            <input type="text" id="company" name="company"  value="{{job.company}}">
        </label>
        <label for="role">
            <input type="text" id="role" name="role" placeholder="{{job.role}}"  value={{job.role}}>
        </label>
        <label for="location">
            <input type="text" id="location" name="location" value="{{job.location}}">
        </label>
        <select name="status" id="status">
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Selected">Selected</option>
            <option value="Rejected">Rejected</option>
        </select>
        <button type="submit">Submit</button>
    </form>
    
    <form action="{{url_for('delete_job',job_id=job.id)}}" method="POST">
        <button type="submit">Delete Job</button>
    </form>
    <a href="{{url_for('home')}}">Back To DashBoard Menu</a>
</body>
</html>
